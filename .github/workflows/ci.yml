name: AuthzGraph CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main"]

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Backend — Python linting + pytest
  # ─────────────────────────────────────────────
  backend-ci:
    name: Backend (Python 3.12 · pytest)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install linter
        run: pip install ruff

      - name: Lint (ruff)
        run: ruff check app/

      - name: Run pytest
        run: python -m pytest -v --tb=short

  # ─────────────────────────────────────────────
  # Job 2: Frontend — npm build (TypeScript + Vite)
  # ─────────────────────────────────────────────
  frontend-ci:
    name: Frontend (Node 22 · Vite build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7
